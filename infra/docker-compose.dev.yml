services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-order_system}
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  # Dev горим: хурдан эхлэхийн тулд embedded H2. Staging/prod дээр
  # эрх бүхий хэрэглэгчийн бодит датаг Postgres backend руу шилжүүлнэ.
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
    ports: ["8080:8080"]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme_master_key}
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: ["meilidata:/meili_data"]

  # Phase 4 §8 Хэсэг B #11: Email мэдэгдлийг БОДИТООР (nodemailer + SMTP)
  # dev/CI-д турших зориулалттай — бодит и-мэйл хэзээ ч явахгүй, бүх
  # илгээсэн зурвасыг localhost:8025 web UI-аар харах боломжтой.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  meilidata:

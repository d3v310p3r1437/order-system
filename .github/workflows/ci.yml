name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  # Migration/CLI-д зориулсан superuser холболт (зөвхөн CI/dev-д ашиглана)
  DATABASE_URL: postgresql://app:app_ci_password@localhost:5432/order_system
  # Апп runtime-ийн хязгаарлагдмал холболт — RLS-ийг бодитоор турших гол шалтгаан.
  # ⚠️ Нууц үг нь infra/create-app-runtime-role.sql-ийн CREATE ROLE-д
  # hardcode хийсэн 'changeme_runtime_dev_only'-той ЗААВАЛ таарах ёстой
  # (яг адилхан локал .env/apps/api/.env-д ашигладагтай) — эс бөгөөс
  # E2E тест "Authentication failed... app_runtime" алдаагаар унана.
  APP_DATABASE_URL: postgresql://app_runtime:changeme_runtime_dev_only@localhost:5432/order_system
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci_only_dummy_secret_do_not_use_in_prod
  JWT_ACCESS_EXPIRY: 15m
  KEYCLOAK_URL: http://localhost:8080
  KEYCLOAK_REALM: order-system
  # test/auth-staff.e2e-spec.ts-д зориулав — доорх "Keycloak realm/client
  # бэлтгэх" алхам эдгээрийг ашиглан admin REST API-аар нэвтэрч
  # order-system realm + api-client client-ийг үүсгэнэ (KEYCLOAK_CLIENT_SECRET
  # тухайн алхамд тооцогдож $GITHUB_ENV-д нэмэгдэнэ).
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: ci_only_dummy_admin_password
  # test/product-image.e2e-spec.ts (§8 Phase 2 Хэсэг A)-д зориулав —
  # доорх "MinIO container асаах" алхам яг ЭДГЭЭР credential-ээр асаана.
  MINIO_URL: http://localhost:9000
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: ci_only_dummy_minio_password
  MINIO_BUCKET: product-images
  # test/search.e2e-spec.ts (§8 Phase 2 Хэсэг B)-д зориулав.
  MEILI_URL: http://localhost:7700
  MEILI_MASTER_KEY: ci_only_dummy_meili_master_key
  # test/notification.e2e-spec.ts (§8 Phase 4, Хэсэг B)-д зориулав —
  # Mailpit бодит SMTP-ээр email хүлээн авч, REST API-аар баталгаажуулна.
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  MAILPIT_API_URL: http://localhost:8025
  # test/delivery-routing.e2e-spec.ts-д зориулав — CI/e2e-д бодит OSRM
  # сүлжээ рүү хэзээ ч хандахгүй (анхдагч mock хэвээр).
  ROUTING_PROVIDER: mock
  NODE_ENV: test

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_password
          POSTGRES_DB: order_system
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO-той адилгүй, Meilisearch-ийн Docker image-ийн анхдагч CMD нь
      # аргументгүйгээр шууд ажилладаг тул (MinIO шиг "server /data" гэсэн
      # заавал шаардлагатай аргумент байхгүй) job-level `services:`-ээр
      # шууд асаах боломжтой — MinIO-г доор тусад нь "docker run"-аар
      # (Keycloak-той адил шалтгаанаар, `services:` нь `command:`
      # дэмждэггүй тул) асаана.
      meilisearch:
        image: getmeili/meilisearch:latest
        env:
          MEILI_MASTER_KEY: ci_only_dummy_meili_master_key
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]

      # Mailpit-ийн Docker image-ийн анхдагч CMD аргументгүйгээр ажилладаг
      # тул Meilisearch-тэй адил шууд `services:`-ээр асаах боломжтой.
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GH Actions-ийн job-level `services:` нь Keycloak-ийн default
      # entrypoint-д шаардлагатай "start-dev" аргументыг дамжуулах command:
      # талбар дэмждэггүй тул энгийн `docker run -d`-ээр асаана. Non-blocking
      # тул дараагийн (Node/pnpm/Prisma) алхамуудтай зэрэгцэн boot хийнэ —
      # бодит хүлээлт/realm бэлтгэл зөвхөн E2E тестийн өмнөх алхамд орно.
      - name: Keycloak container асаах (background-д boot хийнэ)
        run: |
          docker run -d --name keycloak-ci -p 8080:8080 \
            -e KEYCLOAK_ADMIN="$KEYCLOAK_ADMIN" \
            -e KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:latest start-dev

      # MinIO-ийн Docker image ("server /data" гэсэн аргумент заавал
      # шаардлагатай) job-level `services:`-ээр асаах боломжгүй тул
      # (тэдгээр нь `command:` дэмждэггүй) Keycloak-той ижил "docker run"
      # аргаар асаана.
      - name: MinIO container асаах (background-д boot хийнэ)
        run: |
          docker run -d --name minio-ci -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            minio/minio server /data --console-address ":9001"

      - name: psql суулгах (app_runtime role үүсгэхэд хэрэгтэй)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Node суулгах
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: pnpm суулгах
        uses: pnpm/action-setup@v6

      - name: pnpm cache тохируулах
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Dependency суулгах (root, бүх workspace)
        run: pnpm install --frozen-lockfile

      # admin-web нь DB/Keycloak шаардахгүй тул доорх алхмуудаас түрүүлж,
      # хурдан fail-fast хийнэ.
      - name: admin-web Lint
        working-directory: apps/admin-web
        run: pnpm run lint

      - name: admin-web Unit/smoke тест (Vitest + React Testing Library)
        working-directory: apps/admin-web
        run: pnpm run test

      - name: admin-web Build
        working-directory: apps/admin-web
        run: pnpm run build

      # ⚠️ ЧУХАЛ: apps/api/package.json-ий "postinstall" script нь `pnpm
      # install`-ийн үед аль хэдийн prisma generate-ийг дуудсан байх ёстой,
      # гэвч pnpm-ийн ирээдүйн хувилбар (v10+) lifecycle script-ийг
      # анхдагчаар блоклодог тул энд ТОДОРХОЙ ДАВХАР дуудна —
      # үүнгүйгээр @prisma/client-ийн бодит төрлүүд (Prisma.TransactionClient
      # гэх мэт) үүсэхгүй, бүх ашиглалт eslint-д "any" болж, lint шат
      # худал улаан гардаг байсан (2026-08-15 debug: prisma generate
      # дутуу байснаас болж 68 unsafe-any алдаа гарч байсан).
      - name: Prisma client generate хийх (generate-гүйгээр бүх төрөл "any" болж, lint худал унана)
        working-directory: apps/api
        run: pnpm exec prisma generate

      # ⚠️ ЧУХАЛ: superuser (app) холболтоор app_runtime role-г үүсгэнэ.
      # Үүнгүйгээр APP_DATABASE_URL байхгүй тул RLS тестүүд утгагүй болно
      # (superuser холболтоор туршвал бүх policy тойрогдоно — docs/adr/001-г үзнэ үү).
      - name: app_runtime role үүсгэх (RLS-ийг бодитоор турших зайлшгүй нөхцөл)
        run: |
          PGPASSWORD=app_ci_password psql -h localhost -U app -d order_system \
            -f infra/create-app-runtime-role.sql
          # Баталгаажуулалт: superuser/bypassrls аль аль нь заавал "f" байх ёстой,
          # эс бөгөөс дараагийн бүх RLS тест худал "ногоон" гарна.
          RESULT=$(PGPASSWORD=app_ci_password psql -h localhost -U app -d order_system -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'app_runtime'")
          if [ "$RESULT" != "f" ]; then
            echo "::error::app_runtime нь superuser/bypassrls эрхтэй байна — RLS тест итгэмжгүй!"
            exit 1
          fi

      - name: Prisma migration ажиллуулах (superuser холболтоор)
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Lint
        working-directory: apps/api
        run: pnpm run lint

      - name: Unit тест
        working-directory: apps/api
        run: pnpm run test

      # infra/keycloak/setup-realm.sh-ийн хийдэгтэй ижил зүйлийг (realm,
      # api-client, local_user_id attribute/mapper, client secret) CI-ийн
      # docker-run Keycloak эсрэг REST API-аар (kcadm биш, container exec
      # шаардахгүй) бэлтгэнэ — test/auth-staff.e2e-spec.ts үүнийг ашиглана.
      - name: Keycloak realm/client бэлтгэх (test/auth-staff.e2e-spec.ts-д зориулав)
        run: |
          echo "Keycloak бэлэн болохыг хүлээж байна..."
          timeout 120 bash -c \
            'until curl -sf "$KEYCLOAK_URL/realms/master/.well-known/openid-configuration" >/dev/null; do sleep 2; done'

          ADMIN_TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
            -d client_id=admin-cli -d grant_type=password \
            -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" | jq -r .access_token)

          curl -sf -X POST "$KEYCLOAK_URL/admin/realms" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d "{\"realm\":\"$KEYCLOAK_REALM\",\"enabled\":true}"

          CLIENT_UUID=$(curl -sf -X POST "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/clients" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d '{"clientId":"api-client","publicClient":false,"standardFlowEnabled":false,"directAccessGrantsEnabled":true,"serviceAccountsEnabled":false,"enabled":true}' \
            -D - -o /dev/null | grep -i '^location:' | sed 's#.*/##' | tr -d '\r')

          # User Profile-д "local_user_id" attribute нэмнэ (одоо байгаа
          # тохиргоог GET хийж, attributes массивт нэмээд буцааж PUT хийнэ).
          curl -sf "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/users/profile" \
            -H "Authorization: Bearer $ADMIN_TOKEN" | jq \
            '.attributes += [{"name":"local_user_id","displayName":"Local User ID (apps/api users.id)","permissions":{"view":["admin"],"edit":["admin"]},"multivalued":false}]' \
            > /tmp/user-profile.json
          curl -sf -X PUT "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/users/profile" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d @/tmp/user-profile.json

          curl -sf -X POST "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/clients/$CLIENT_UUID/protocol-mappers/models" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d '{
              "name": "local_user_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "local_user_id",
                "claim.name": "local_user_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }'

          CLIENT_SECRET=$(curl -sf "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/clients/$CLIENT_UUID/client-secret" \
            -H "Authorization: Bearer $ADMIN_TOKEN" | jq -r .value)
          echo "::add-mask::$CLIENT_SECRET"
          echo "KEYCLOAK_CLIENT_SECRET=$CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: MinIO/Meilisearch/Mailpit бэлэн болохыг хүлээх
        run: |
          timeout 60 bash -c 'until curl -sf "$MINIO_URL/minio/health/live" >/dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf "$MEILI_URL/health" >/dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf "$MAILPIT_API_URL/api/v1/info" >/dev/null; do sleep 2; done'

      - name: E2E тест (бодит Postgres/Redis/RLS-тэй)
        working-directory: apps/api
        run: pnpm run test:e2e

      - name: Prod build (§10.2, custom output зам гэх мэт алдааг барина)
        working-directory: apps/api
        run: pnpm run build

      - name: Build дараах smoke test — сервер бодитоор асаж байгааг шалгах
        working-directory: apps/api
        run: |
          node dist/src/main.js &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            BODY=$(curl -sf http://localhost:3000/health || true)
            if [ "$BODY" = '{"status":"ok"}' ]; then
              echo "✅ Сервер амжилттай асаж, /health-ээс зөв хариу өглөө"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "::error::Сервер 15 секундэд /health-ээс зөв хариу ({\"status\":\"ok\"}) өгсөнгүй"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
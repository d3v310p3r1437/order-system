org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows + project/pub-cache өөр драйв (жиш: apps/mobile нь D:\, Pub Cache
# нь C:\Users\...) дээр Kotlin-ийн incremental compiler
# (compileDebugKotlin, жиш shared_preferences_android плагин) cache файлаа
# хаахдаа RelocatableFileToPathConverter.toPath()-ийн relativeTo()-оор
# 2 өөр драйвын absolute зам хооронд харьцангуй зам тооцоолохыг оролдож
# "this and base files have different roots" (IllegalArgumentException)
# шидэж build-ийг тогтмол унагаадаг байсныг бодитоор баталсан
# (`flutter clean` + Gradle daemon дахин эхлүүлсэн ч давтагдсан).
# Incremental compilation-ийг унтраасан нь Kotlin build-ийг арай удаашруулах
# ч (full recompile) энэ орчинд цорын ганц найдвартай шийдэл.
kotlin.incremental=false
